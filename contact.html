<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Luxe Dine</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .contact-container {
        display: flex;
        max-width: 1000px;
        margin: 5rem auto;
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(26, 58, 95, 0.1);
      }
      .contact-info {
        flex: 1;
        background: var(--primary);
        color: white;
        padding: 3rem;
      }
      .contact-form {
        flex: 1.5;
        padding: 3rem;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      input,
      textarea {
        width: 100%;
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: inherit;
        outline: none;
        transition: 0.3s;
      }
      input:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      @media (max-width: 768px) {
        .contact-container {
          flex-direction: column;
          margin: 2rem 5%;
        }
        .contact-info,
        .contact-form {
          padding: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">Luxe<span>Dine</span></div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <div class="burger">
        <div class="line1"></div>
        <div class="line2"></div>
        <div class="line3"></div>
      </div>
    </nav>

    <section class="contact-section">
      <div class="contact-container">
        <div class="contact-info">
          <h2 style="color: var(--accent)">Visit Us</h2>
          <p style="margin: 2rem 0; opacity: 0.8">
            We are located in the heart of the city. Experience fine dining like
            never before.
          </p>
          <p style="margin-bottom: 0.8rem">
            <strong>Address:</strong> 123 Luxury Lane, Cairo
          </p>
          <p style="margin-bottom: 0.8rem">
            <strong>Phone:</strong> +20 123 456 789
          </p>
          <p><strong>Hours:</strong> Mon-Sun: 12 PM - 12 AM</p>
        </div>
        <div class="contact-form">
          <h2>Send a Message</h2>
          <form>
            <div class="form-group">
              <input type="text" placeholder="Your Name" required />
            </div>
            <div class="form-group">
              <input type="email" placeholder="Email Address" required />
            </div>
            <div class="form-group">
              <textarea
                rows="5"
                placeholder="How can we help you?"
                required
              ></textarea>
            </div>
            <button
              type="submit"
              class="btn"
              style="width: 100%; border: none; cursor: pointer"
            >
              Send Message
            </button>
          </form>
        </div>
      </div>
    </section>

    <footer>
      <p>&copy; 2026 Luxe Dine Restaurant. All rights reserved.</p>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
